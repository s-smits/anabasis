# Fails on a pull request that repeats another open pull request's commits, or that another repeats.
#
# A pull request shows the commits from its base to its head. On 30 October 2026 `gh stack link`
# based #531 on #529's branch while its head held #530's, so #531 listed #530's commits as its own;
# the base moved on GitHub with no push, so `mergeable.yml`, run on pushes only, never saw it, and
# `bun run land` would have refused it only at the next landing. This job reads every open pull
# request's head and base as the pull request opens, moves or has its base changed (`edited`), and
# fails where a head holds another's without standing on it (`tools/runtime/doubled.ts`). Pull
# requests may stack in any order. No install and no test: Bun, gh and the full history only.
name: stacked
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
permissions:
  contents: read
  pull-requests: read
jobs:
  doubled:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Refuse a head that holds another open pull request's without standing on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/runtime/doubled.ts --pull ${{ github.event.pull_request.number }}
