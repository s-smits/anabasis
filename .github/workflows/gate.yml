# The composed gate on GitHub Actions: the same deterministic runtime, typecheck, lint and test
# boundary as the pre-push hook in .githooks/pre-push. The hook is what gates a change; this is not
# a required check, so a pull request merges without it.
#
# It runs once a day against main rather than on every push or pull request, because the pre-push
# hook already runs this gate on every source push, which catches nearly everything first. What only
# CI shows is the Linux isolation (below) and a clean-runner install, and a daily reading of main
# covers both. A day with no new commits on main costs nothing: the `changed` job compares main's
# head with the last completed run's and skips both runners when they match. A manual dispatch
# always runs, which is how to re-check a head whose daily run failed without a new commit.
#
# Both jobs use the stable release in .bun-version, shared with local setup and launch.
#
# Two runners, because the OS isolation now has two mechanisms and each one is only exercised on its own
# platform. The Darwin job proves Seatbelt; the Linux job proves Bubblewrap. Neither substitutes for
# the other: on 2026-08-07 the whole suite passed on macOS while 74 Linux tests failed for one
# reason, and no macOS run could have shown it.
#
# The earlier revision of this comment said the gate was "Darwin-only by design
# (tools-probe-runtime-policy.ts refuses other platforms)". That file does not exist in the
# repository, and `assertSupportedHostRuntime` accepts Linux — it pins the runtime, not the OS.
name: gate
on:
  schedule:
    # 03:17 UTC, off the top of the hour, where scheduled runs queue longest. A scheduled run always
    # checks out the default branch, so this is main as it stands that day.
    - cron: "17 3 * * *"
  workflow_dispatch:
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        # The last completed run on main, failed or passed: a failed head is not retried daily,
        # since nothing about it changed. A cancelled run read nothing, so it is passed over, and
        # the run in progress is not completed, so it is never its own comparison.
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$REPO" --workflow gate.yml --branch main --status completed \
            --limit 20 --json headSha,conclusion \
            --jq '[.[] | select(.conclusion != "cancelled")][0].headSha // ""')
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "main is still at $HEAD_SHA, which the last completed run already read"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved from ${last:-no earlier run} to $HEAD_SHA"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  darwin:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install ripgrep
        # Three builder-tools tests read rg output and fail without naming the missing binary.
        run: brew install ripgrep
      - name: Prepare dependencies
        # Through the script every worktree uses, so the checkout carries the dependency marker and
        # the trees tests stage clone its node_modules instead of installing their own.
        run: bash scripts/worktree.sh setup "$GITHUB_WORKSPACE"
      - run: bun run gate

  linux:
    # A VM runner, not a container. Bubblewrap needs to create user and mount namespaces, which an
    # ordinary container withholds: measured 2026-08-07 on Docker 28.2.2, the baseline argv fails
    # with "Can't mount proc on /newroot/proc" without seccomp and CAP_SYS_ADMIN. A `container:`
    # job here would report an unavailable mechanism for every confined test.
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install ripgrep and bubblewrap
        # ripgrep for the same three builder-tools tests as the Darwin job. ubuntu-24.04 packages
        # bubblewrap 0.9.0, above the version the isolation needs, so the runner's own package is used.
        run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor, and bwrap then fails with "setting up uid
        # map: Permission denied": the first public run, 35734926609 on 2026-09-22, stopped there.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Confirm the isolation mechanism is usable on this runner
        # Separated from the gate so a runner or kernel policy change does not read as a source
        # regression: the gate's own failure text names an unavailable mechanism either way.
        #
        # 0.8.0 is the floor because that is where `--disable-userns` appears. Measured 2026-08-07
        # on Ubuntu 22.04: 0.6.1 refuses every launch and fails 74 tests, while 0.8.0 and 0.11.1
        # each pass the whole gate. The runner's 0.9.0 sits between two verified-good versions.
        run: |
          set -euo pipefail
          bwrap --version
          installed=$(bwrap --version | awk '{print $2}')
          if [ "$(printf '%s\n0.8.0\n' "$installed" | sort -V | head -1)" != "0.8.0" ]; then
            echo "bubblewrap $installed is older than the 0.8.0 the OS isolation needs" >&2
            exit 1
          fi
          bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup \
                --cap-drop ALL --disable-userns --die-with-parent --new-session \
                --bind / / --proc /proc --dev /dev /bin/true
          echo "bubblewrap $installed confines on this runner"

      - name: Prepare dependencies
        # Through the script every worktree uses, so the checkout carries the dependency marker and
        # the trees tests stage clone its node_modules instead of installing their own.
        run: bash scripts/worktree.sh setup "$GITHUB_WORKSPACE"
      - run: bun run gate
