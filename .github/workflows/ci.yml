# Typecheck, lint, format, the UI's gate and the suite, on main and on the head
# `bun run land -- <top> --merge` dispatches it on.
#
# No pull request starts a run: `land --merge` reads `ci.yml` on the top's head alone, dispatches that
# run itself, and merges nothing before it has passed (`tools/runtime/land.ts`). Until 19 October
# every push to every pull request started one, three jobs each: one push of the stack #193 to #223
# queued 16 runs, 15 of which nothing read, and they held the macOS runners the top's run waited for.
# A `pull_request` trigger filtered to `branches: [main]` still ran on a pull request of a GitHub
# stack based on another, so the trigger is gone rather than filtered.
#
# Two platforms, because the OS isolation has two mechanisms and each is exercised only on its own
# platform: the Darwin job proves Seatbelt and the disk image a solve and a Builder session mount
# there; the Linux job proves Bubblewrap. A whole suite passing on one says nothing of the other.
# The UI's own gate runs beside them on a macOS runner of its own (`darwin-ui`).
# The lint is strict: the two repository plugins' findings fail it, as they do a strict run by hand
# (`bun run lint -- --strict`, `tools/oxlint/HABITS.md` 12.2). The Linux job also runs the climb
# simulation, which the suite skips without `ANA_CLIMB`: the controller's guard in
# `docs/simplify.md` section 9, a few minutes.
# Every step after the install runs once the install has, whatever failed between, and the job
# fails if any did: on 14 October a failed `ui:gate` skipped the typecheck, the lint, the format
# check and the whole suite, so one run named one failure where it could have named all. Since
# 19 October `darwin-ui` runs `ui:gate`'s steps apart for the same reason: its `&&` let a failed
# build skip every UI test. No step bails at its first failure: the suite runs every file.
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  darwin:
    # macOS 15, as the Mac the solves run on. Until 14 October the disk cap also moved a released
    # image to the Trash with /usr/bin/trash, which macOS 14 does not have; it unlinks it since.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # `bun run runs search` runs rg, which the macOS image does not ship.
      - run: brew install ripgrep
      - id: install
        run: bun install --frozen-lockfile
      # The UI's own lock and React types, without which the lint leaves packages/ui out.
      - run: bun run ui:deps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run lint -- --strict
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Every tracked file, where the pre-push hook scans only what a push adds.
      - run: bun run secrets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  darwin-ui:
    # The UI's own gate, with its browser tests, on a runner of its own: on 14 October its 235 tests
    # took 9 to 23 minutes on a macOS runner of 3 cores, and the suite 23 to 35, so one job holding
    # both passed its 45 minutes before the suite ended.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: install
        run: bun install --frozen-lockfile
      # `ui:gate`'s three steps apart, so that a failed build still runs the tests.
      - id: deps
        run: bun run ui:deps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run ui:build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: bun run test -- packages/ui/test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

  linux:
    # A VM runner, not a container: Bubblewrap creates user and mount namespaces, which an ordinary
    # container withholds.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install bubblewrap and ripgrep
        # ubuntu-24.04 packages bubblewrap 0.9.0, above the 0.8.0 that carries --disable-userns.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor, and bwrap then fails with "setting up uid
        # map: Permission denied".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: install
        run: bun install --frozen-lockfile
      - run: bun run test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: The climb simulation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ANA_CLIMB=1 bun run test -- test/climb.test.ts
