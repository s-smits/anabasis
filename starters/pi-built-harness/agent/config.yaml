# Runtime walls of this harness, in seconds, read from the submitted candidate. A change is a
# product change. At submit the host refuses a solver wall more than ten times its seeded value
# or below a tenth of it; gate walls have no maximum. Anything between is this harness's own
# choice, and a longer solve makes every measured round slower.
solver:
  solve_seconds: 7200 # one whole solve of one task
  shell_command_seconds: 900 # one solver shell command, whatever timeout it passes
gate:
  reference_solve_seconds: 120 # one reference solve of one task
  check_seconds: 600 # one correctness check with its tool runs
  tool_run_seconds: 300 # one verifier tool run inside a check
